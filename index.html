<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src ="src/index.js"></script>
    <link rel = "stylesheet" href="src/styles.css">
</head>
<body> 
    

        <h1 > Welcome to ShareFlix </h1>
    
   
   <div class="container right-panel-active" id="myContainer">
	<!-- Sign Up -->
	<div class="container__form container--signup">
		<form action="#" class="form" id="form1" onsubmit="handleSubmit()">
			<h2 class="form__title">Sign Up</h2>
			<input type="text" placeholder="User" class="input"  required/>
			<input type="email" placeholder="Email" class="input" required />
			<input type="password" placeholder="Password" class="input" required />
			<button class="btn">Sign Up</button>
		</form>
	</div>

	<!-- Sign In -->
	<div class="container__form container--signin" onsubmit="handleSubmit()">
		<form action="#" class="form" id="form2">
			<h2 class="form__title">Sign In</h2>
			<input type="email" placeholder="Email" class="input" required/>
			<input type="password" placeholder="Password" class="input" required/>
			<a href="#" class="link">Forgot your password?</a>
			<button class="btn">Sign In</button>
		</form>
	</div>

	<!-- Overlay -->
	<div class="container__overlay">
		<div class="overlay">
			<div class="overlay__panel overlay--left">
				<button class="btn" id="signIn">Sign In</button>
			</div>
			<div class="overlay__panel overlay--right">
				<button class="btn" id="signUp">Sign Up</button>
			</div>
		</div>
	</div>
</div>
  
   
    <script>
        const signInBtn = document.getElementById("signIn");
        const signUpBtn = document.getElementById("signUp");
        const firstForm = document.getElementById("form1");
        const secondForm = document.getElementById("form2");
        //QuerySelector used here
        const container = document.querySelector(".container");

        signInBtn.addEventListener("click", () => {
            container.classList.remove("right-panel-active");
        });

        
        signUpBtn.addEventListener("click", () => {
    	container.classList.add("right-panel-active");
        });
        
        const imagesWithText = [
            {
            imageUrl: "./src/images/Batman.jpg",
            textContent: " The Dark Knight Rises"
        },
            {
                imageUrl: "./src/images/DarthVader.jpg",
            textContent: " Star Wars"
        }, 
            {
                imageUrl: "./src/images/Jason.jpg",
            textContent: " Friday the 13th"
        },
  // Add more image-text pairs as needed
];






//Removing the form element and container after the submit is picked
function handleSubmit(){
    document.getElementById("form1").style.display ="none";
    document.getElementById("form2").style.display ="none";
    document.getElementById("myContainer").style.display ="none";
    
    //Change content of textContent
    const h1Element = document.querySelector('h1');
    h1Element.textContent="Welcome";
    h1Element.style.textAlign= "center";

    const movieTypes = document.createElement("div");
movieTypes.style.backgroundColor = "white";
movieTypes.style.height = "45%";
movieTypes.style.width = "50%";
movieTypes.style.textAlign = "center";
movieTypes.textContent = " These are some of the movies your friends are watching"
document.body.append(movieTypes);

    function displayImages() {
        const container = document.createElement("div");
        container.style.display = 'flex';

        //Iterating over images to show and style movie content and appending it to the body
        imagesWithText.forEach(item => {
            const imgElement = document.createElement("img");
            imgElement.src = item.imageUrl;
            imgElement.alt = item.textContent; 
            imgElement.style.height = "250px";
            imgElement.style.width = "250px";
            imgElement.style.margin = "10px auto";
            imgElement.style.padding = "10px ";
            imgElement.style.display ="block";

            
        

    const textElement = document.createElement("p");
    textElement.textContent = item.textContent;
    textElement.style.width = "250px";




    container.style.color = "black";
    container.style.backgroundColor = "white";
    container.style.margin = " 10px";
    container.style.padding = " 10px";

    container.appendChild(imgElement);
    container.appendChild(textElement);
  });
document.body.appendChild(container);

}

// Call the function to display the images
displayImages();

const movieGenre = document.createElement("div");
movieGenre.style.backgroundColor = "white";
movieGenre.style.height = "105%";
movieGenre.style.width = "50%";
movieGenre.style.textAlign = "center";
movieGenre.textContent = " These are movie genres your friends are watching"
document.body.append(movieGenre);


/* Use the parent-child-sibling relationship to navigate between elements a */

const ul = document.createElement('ul');

const items = ['Action', 'Scary', 'Si-Fi'];
items.forEach(itemText => {
    const li = document.createElement('li');
    li.textContent = itemText;
    li.textAlign = "left";
    ul.appendChild(li);
});
movieGenre.appendChild(ul);

//Using the parent-child sibling relationship to navigate between elements
const h3Tag = document.createElement('h3');
h3Tag.textContent = " Would you like to watch?";
movieGenre.append(h3Tag);
movieGenre.append(ul.lastElementChild.innerHTML);

//Using the BOM



}
    </script>
    
</body>
</html>
